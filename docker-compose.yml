services:
  postgres:
    image: postgres:16-alpine
    container_name: bee3ly-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: bee3ly
      POSTGRES_PASSWORD: bee3ly
      POSTGRES_DB: bee3ly
    volumes:
      - bee3ly_pg_data:/var/lib/postgresql/data

volumes:
  bee3ly_pg_data:
