# Deploy backend + AI + infra to Bee3ly-dev on push to main.
# Requires GitHub repo secrets (Settings → Secrets and variables → Actions):
#   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_ACCOUNT_ID
# Repository variable (optional):
#   DEV_FRONTEND_URL — CORS origin for the API (default https://bee3ly.net)
#
# The frontend is hosted on Vercel, not AWS. FRONTEND_URL is only the browser origin the API allows.

name: Deploy AWS dev

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'ai-services/**'
      - 'infra/**'
      - '.github/workflows/deploy-aws-dev.yml'
  workflow_dispatch:

concurrency:
  group: bee3ly-deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: infra/package-lock.json

      - name: CDK deploy Bee3ly-dev
        env:
          CDK_DEFAULT_ACCOUNT: ${{ secrets.AWS_ACCOUNT_ID }}
          CDK_DEFAULT_REGION: eu-north-1
          DEV_FRONTEND_URL: ${{ vars.DEV_FRONTEND_URL }}
        run: |
          FRONTEND_URL="${DEV_FRONTEND_URL:-https://bee3ly.net}"
          cd infra
          npm ci
          npx cdk deploy Bee3ly-dev \
            -c env=dev \
            -c "frontendUrl=${FRONTEND_URL}" \
            --require-approval never
